[package]
name = "ikigai-ui-gpui"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"
description = "Native GPUI walker and off-thread snapshot loader for ikigai-ui"
repository = "https://github.com/ikigai-rs/ikigai-ui"
publish = false

[features]
default = []
# Draw `scene` natively (ledger #3516): the scene datum rendered offscreen with wgpu, through the
# html face's own WGSL, read back and painted as an image. Off, `scene` falls back to its
# replacement (the graph as text), as it did in phase 1.
scene = ["dep:wgpu", "dep:pollster", "dep:image"]

[dependencies]
ikigai-ui = { path = ".." }
ikigai-core = "0.3.0"
serde_json = "1"

# Resource work is independent of the window platform.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
futures = "0.3"

# The window code, on every target GPUI has a window platform for. Each target's own table below
# names that target's backends; this one adds nothing to `gpui`'s features but the shaders.
[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "freebsd", target_os = "windows"))'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["runtime_shaders"] }
unicode-segmentation = "1.12"
# The demo's HTML door, beside its windows: one kernel, one store.
ikigai-ui-demo = { path = "../demo" }
tokio = { version = "1", features = ["rt", "net"] }
ikigai-web = "0.5.0"
# The `scene` feature's offscreen renderer (ledger #3516): a second GPU device beside GPUI's own.
# Each backend is compiled only on its own platform (Metal on macOS, DX12 on Windows).
wgpu = { version = "25", optional = true, default-features = false, features = ["metal", "vulkan", "dx12", "wgsl"] }
pollster = { version = "0.4", optional = true }
# The frame handed to GPUI as a `RenderImage` (GPUI's own image crate; the bytes are BGRA).
image = { version = "0.25", optional = true, default-features = false }

[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "freebsd"))'.dependencies]
# GPUI's zed-async-tar -> xattr 0.2 still uses Linux ENOATTR, removed in
# libc 0.2.190. Keep that compatible until GPUI updates its tar dependency.
libc = "=0.2.189"

[target.'cfg(target_os = "macos")'.dependencies]
# ★ `font-kit` is GPUI's macOS text system. It is a DEFAULT feature, so turning defaults off
# above dropped it, and GPUI then installs `NoopTextSystem`: every window drew its boxes and no
# text at all (headings, labels, button captions), while the test platform's snapshots passed.
gpui = { version = "=0.2.2", default-features = false, features = ["runtime_shaders", "font-kit"] }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
# ★ The Linux and FreeBSD window platforms (ledger #3526), BY NAME, for the same reason: with
# neither, GPUI falls back to its headless client and no window opens; with one, the text system
# is `CosmicTextSystem` (cosmic-text, which `wayland` and `x11` enable themselves, with GPUI's
# `font-kit` for font discovery). Wayland is chosen when WAYLAND_DISPLAY is set, else X11 on
# DISPLAY. Both render through blade on Vulkan. Linking needs libxkbcommon, libxkbcommon-x11 and
# libxcb (README: "Linux").
gpui = { version = "=0.2.2", default-features = false, features = ["runtime_shaders", "wayland", "x11", "font-kit"] }

[target.'cfg(target_os = "windows")'.dependencies]
# ★ The Windows window platform needs no feature (its text system is DirectWrite, always on);
# `windows-manifest` embeds GPUI's application manifest (per-monitor DPI awareness, the common
# controls GPUI's dialogs use), which GPUI's own binaries carry and GPUI's defaults turn on.
gpui = { version = "=0.2.2", default-features = false, features = ["runtime_shaders", "windows-manifest"] }

# GPUI test-support forces X11/Wayland link dependencies even for headless
# tests. Keep actual test windows on macOS; stock Linux CI still compiles the
# walker and exercises the background boundary against real faces and Sinks.
[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["runtime_shaders", "test-support"] }

[dev-dependencies]
ikigai-ui-demo = { path = "../demo" }

[[bin]]
name = "ikigai-ui-demo-native"
path = "src/main.rs"
