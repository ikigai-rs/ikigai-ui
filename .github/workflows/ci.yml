name: ci
on:
  push: { branches: [main] }
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}   # never cancel main
jobs:
  ci:
    uses: ikigai-rs/.github/.github/workflows/rust.yml@main
    with:
      wasm-lib: true
  # axe and the shell script's browser checks over the demo site (non-cargo, so local to
  # this repo: field guide 9g), through the same reusable workflow a UI repo calls, at THIS
  # commit's checker. Unconditional on purpose: a path filter is a gate that silently does
  # not run (9c).
  axe:
    uses: ./.github/workflows/axe.yml
    with:
      prepare: cargo run --example axe_site -- target/axe-site
      site: target/axe-site
      checker-ref: ${{ github.event.pull_request.head.sha || github.sha }}
      smoke: true
  # The README's HTML screenshots (ledger #3528), regenerated from the demo's fixtures in this
  # runner's Chromium and uploaded as the `screenshots` artifact. The job fails, naming each
  # image, when docs/screenshots/ was taken from a page or stylesheet that has since changed;
  # it never compares pixels, so fonts or a GPU on another machine cannot fail it. To refresh:
  # `scripts/screenshots.sh`, or commit this job's artifact.
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright (exact pins, from its lock)
        working-directory: axe
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        working-directory: axe
        run: npx playwright install --with-deps chromium || { echo "::warning::apt deps unavailable; installing Chromium alone"; npx playwright install chromium; }
      - name: Screenshots, checked against docs/screenshots
        run: scripts/screenshots.sh --check
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: target/screenshots
          if-no-files-found: ignore

  # Real VoiceOver over the gallery (ledger #4278, from the #3545 spike:
  # docs/research/screen-reader-ci.md). INFORMATIONAL, never a gate: `continue-on-error`, and it
  # must never be made a required check. The blocking accessibility-tree check stays
  # `axe/aria.spec.mjs` in the `axe` job; a red run here more often means "macOS or VoiceOver
  # changed" than "we broke something". One job, no retries; what VoiceOver said is uploaded as
  # the `voiceover` artifact. Guidepup's setup and packages are pinned exactly (its packages
  # from voiceover/package-lock.json).
  voiceover:
    runs-on: macos-15
    continue-on-error: true
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Write the site (the one the axe job checks)
        run: cargo run --example axe_site -- target/axe-site
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Allow VoiceOver to be driven (Guidepup's setup, exact version)
        run: npx -y --ignore-scripts=false @guidepup/setup@0.29.3 setup --ci
      - name: Install Guidepup and Playwright (exact pins, from its lock)
        working-directory: voiceover
        run: npm ci --no-audit --no-fund
      - name: Install Guidepup's screen-reader assets and preferences (as its own CI does)
        working-directory: voiceover
        run: npx -y --ignore-scripts=false @guidepup/setup@0.29.3 install
      - name: Install WebKit
        working-directory: voiceover
        run: npx playwright install webkit
      - name: VoiceOver
        working-directory: voiceover
        env:
          SITE: ${{ github.workspace }}/target/axe-site
        run: npx playwright test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voiceover
          path: voiceover/results
          if-no-files-found: ignore
