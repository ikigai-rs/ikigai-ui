# The library at the root, and its demo host beside it (ledger #3356). ikigai-ui-gpui lands
# here next. The library is still the published crate; every other member is `publish = false`.
[workspace]
members = [".", "demo", "gpui", "apps/reader"]
# MSRV-aware resolution: each dependency's newest version that still builds on
# `rust-version`, since CI commits no lockfile.
resolver = "3"

[package]
name = "ikigai-ui"
version = "0.5.0"
edition = "2021"
# ikigai-core needs 1.87 (`usize::is_multiple_of`); 1.88 since ledger #3367, for the
# ikigai-lisp dev-dependency (`slice::as_chunks`, via Steel), which the shared CI's msrv job builds
# with `--all-targets`.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "The shared UI path for ikigai hosts, as resources: vendored htmx, the token stylesheet, the shell script and the page shell, compiled in or overridden from a directory, plus the UI test kit."
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
repository = "https://github.com/ikigai-rs/ikigai-ui"
homepage = "https://github.com/ikigai-rs/ikigai-ui"
readme = "README.md"
keywords = ["ikigai", "roc", "htmx", "ui", "module"]
categories = ["web-programming", "wasm"]
# The crate is the library, its compiled-in artifacts and the test kit. The repo's tests,
# examples and the axe checker are the repo's.
exclude = ["/tests", "/examples", "/axe", "/.github", "/demo"]

[features]
default = []
# The UI test kit (UI conventions D18), for a UI repo's dev-dependency.
testkit = ["dep:futures-executor"]

[dependencies]
# 0.3.0 is the scoped content store (ledger #2965): held content is scoped to whoever delivered
# it, and `ContentStore::put`/`put_replay` are root-only. This crate calls neither. The
# `AliasTable::{exact,prefix}_at_root` that `pages` uses so a family's header, titles and
# fragments resolve from the root (ledger #2061) came in 0.1.110. A caret on 0.3.0 is <0.4.0.
ikigai-core = "0.3.0"
# The shell is an ikigai-fn compose template (`composeOver`, a named instance); the token
# stylesheet fills its palette slots itself, from parsed tables (ledger #3529). 0.5.1 is the floor: `{+name}`, RFC 6570 reserved expansion in a marker IRI, which
# the shell's title and main markers use so a page name with `:` reaches its fragment whole
# (ledger #2140, ikigai-rs/ikigai-fn#20); plus 0.5.0's escaping (`$h` per FND-H's rule set, ledger #1813)
# and `ikigai_fn::html`, which the head slot and the test kit use. 0.8 brought reference
# arguments and 0.9 was the shared host floor (ledger #2840); 0.10.0 is the release on
# ikigai-core 0.3.0. A caret on it is <0.11.0.
ikigai-fn = "0.10.0"
# ikigai-a11y's `ratio` and `Rgba` are the contrast math every other UI test uses (default
# features off: no syntect). The library holds a palette read as data to the contrast floor
# with it (`palette::Table`, ledger #3529), and the test kit measures with it. 0.6.0 is the
# release on ikigai-core 0.3.0; <0.7.0.
ikigai-a11y = "0.6.0"
# The UI model's JSON face (ledger #3352), and the test kit's vectors reader. 1.0 is every
# serde_json there is.
serde_json = "1.0"
# The UI model's types.
serde = { version = "1.0", features = ["derive"] }
# A region's narrowed space is named by the SHA-256 of what it binds (ledger #3361).
sha2 = "0.10"
# Screens as s-expressions (ledger #3367): `ikigai_sexpr::parse`, the neutral datum every Lisp
# adapts into, is the reader; `write` is the printer of a model's s-expression face. Default
# features off: the code-graph codec (oxrdf) is not needed, and the library stays wasm-clean.
# 0.4.0 is the release on ikigai-core 0.3.0; a caret on it is <0.5.0.
ikigai-sexpr = { version = "0.4.0", default-features = false }
# The test kit's `render`, which drives a kernel from a synchronous test.
futures-executor = { version = "0.3", optional = true }

[dev-dependencies]
# This crate's own tests use the test kit, as a UI repo does.
ikigai-ui = { path = ".", features = ["testkit"] }
futures = "0.3"
# The module recipe as one test (tests/conformance.rs), at the current minor. 0.12.0 turned on
# the BODIES and BODY-INPUTS checks by default (ledger #2559). 0.14.0 is the release on
# ikigai-core 0.3.0, so the test build links one core. A caret on it is <0.15.0.
ikigai-conformance = "0.14.0"
# The directory delivery (D17), for real: ikigai-fs's FileEndpoint at urn:iki:ui:dir:{path}.
# 0.4.0 is the release on ikigai-core 0.3.0.
ikigai-fs = "0.4.0"
# tests/htmx.rs holds the vendored bytes to the published digests.
sha2 = "0.10"
# tests/model.rs holds the Turtle shapes and the Rust validator to agreement. 0.6.0 is the
# release on ikigai-core 0.3.0; the subset validator (no rudof, default features off) covers
# every construct the shapes use.
ikigai-shacl = { version = "0.6.0", default-features = false }
base64 = "0.22"
# The test hosts' Meta renderer, as a real host configures one: the forms (ledger #3354) read a
# resource's contract as Meta `as=application/json`. 0.3 is the release on ikigai-core 0.3.
ikigai-vocab = "0.3"
# tests/door.rs: a form generated from a `urn:` contract submits through a real ikigai-web door
# to the resource's Sink. 0.5.0 is the current door release, still on ikigai-core 0.3;
# a caret on it is <0.6.0.
ikigai-web = "0.5.0"
tokio = { version = "1", features = ["rt", "net", "io-util", "macros"] }
# tests/screen.rs binds prefix tables with `DynamicSpace::refresh`, behind `declare` (ledger #3365).
ikigai-core = { version = "0.3.0", features = ["declare"] }

# tests/view.rs: a type's shape is read through the host's JSON-LD (ledger #3405): ikigai-rdf's
# `urn:rdf:transrept` turns a Turtle shape into JSON-LD, and ikigai-jsonld's `urn:jsonld:compact`
# compacts any JSON-LD shape against the view's own context. The library issues both, never
# links them, so it stays free of an RDF parser. Both are the releases on ikigai-core 0.3.0.
ikigai-rdf = "0.5.0"
ikigai-jsonld = "0.4.0"
# Lenses (ledger #3518): a lens's query runs on a real `urn:sparql:select`, over the contact
# graph resolved through the kernel. 0.5.0 is the release on ikigai-core 0.3.0 and ikigai-rdf 0.5.
ikigai-sparql = "0.5.0"
# Lenses 4 (ledger #3521): `shacl-violations` joins `urn:shacl:validate`'s report (ikigai-shacl,
# above) to the data, and `asserted-vs-derived` sets the asserted graph beside
# `urn:reason:inferred`, OWL 2 RL entailments only. 0.5.0 is the release on ikigai-core 0.3.0.
ikigai-reason = "0.5.0"

[dev-dependencies.ikigai-lisp]
# tests/sexpr.rs: a screen that is a Lisp program runs through the real `urn:lisp:eval`, which a
# host binds (this crate issues it, never links it: the library carries no Lisp engine). 0.5.0
# is the release on ikigai-core 0.3.0 and ikigai-sexpr 0.4.0; a caret on it is <0.6.0.
version = "0.5.0"

[package.metadata.docs.rs]
# Document the test kit too.
features = ["testkit"]
